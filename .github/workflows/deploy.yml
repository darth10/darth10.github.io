name: Deploy

on:
  push:
    branches: [cryogen]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
       !contains(github.event.head_commit.message, '[no deploy]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: master
          path: public
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: install nix flake
        run: nix develop --command true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: bun install
        working-directory: web
        run: nix develop --command bun install --frozen-lockfile
      - name: clean
        working-directory: public
        run: |
          git rm -rq --ignore-unmatch .
          git clean -fdxq
      - name: compile
        run: nix develop --command clj -X:compile
      - name: commit
        working-directory: public
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only --diff-filter=M -- '*.xml' | while read -r f; do
            strip='s|<lastBuildDate>[^<]*</lastBuildDate>||'
            if cmp -s <(git show "HEAD:$f" | sed "$strip") <(sed "$strip" "$f"); then
              git restore --source=HEAD --staged --worktree -- "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No changes to deploy'
            exit 0
          fi
          git commit -q -m "Site updated on $(date -u +%d/%m/%Y)" -m "Built from ${GITHUB_SHA}"
          git push origin HEAD:master
